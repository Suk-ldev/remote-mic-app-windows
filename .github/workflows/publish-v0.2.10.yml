name: Publish v0.2.10 after Windows CI

on:
  workflow_run:
    workflows: ["Windows CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: "389660506"
      RELEASE_TAG: v0.2.10
      RELEASE_TARGET: ade37a8eaf32f50519e796a32d03acb0f8a6521b
    steps:
      - name: Verify draft assets and publish
        shell: bash
        run: |
          set -euo pipefail

          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          if jq -e '.draft == false' <<<"${release}" >/dev/null; then
            echo "${RELEASE_TAG} is already published"
            exit 0
          fi

          jq -e \
            --arg tag "${RELEASE_TAG}" \
            --arg target "${RELEASE_TARGET}" \
            '.draft == true and .tag_name == $tag and .target_commitish == $target' \
            <<<"${release}" >/dev/null

          expected_assets="$(printf '%s\n' \
            'SHA256SUMS.txt' \
            'SayAll-Windows-0.2.10-x64-setup.exe' \
            'SayAll-Windows-0.2.10-x64-setup.exe.sig' \
            'latest.json')"
          actual_assets="$(jq -r '.assets[].name' <<<"${release}" | sort)"
          test "${actual_assets}" = "${expected_assets}"
          jq -e 'all(.assets[]; .state == "uploaded" and .size > 0)' \
            <<<"${release}" >/dev/null

          latest_asset_id="$(jq -r '.assets[] | select(.name == "latest.json") | .id' <<<"${release}")"
          latest_path="${RUNNER_TEMP}/latest.json"
          gh api \
            -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${latest_asset_id}" \
            >"${latest_path}"
          jq -e \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/SayAll-Windows-0.2.10-x64-setup.exe" \
            '.version == "0.2.10" and
             .platforms["windows-x86_64"].url == $url and
             (.platforms["windows-x86_64"].signature | length > 0)' \
            "${latest_path}" >/dev/null

          notes_path="${RUNNER_TEMP}/release-notes.md"
          cat >"${notes_path}" <<'EOF'
          ## 无线麦 SayAll Windows v0.2.10

          ### 修复
          - 双击判定改为跟随 Windows 双击速度，并限制在 0.5-0.9 秒，减少蓝牙遥控器自然双击被识别成两次单击。
          - 映射按键新增可调保持时间，默认 30 毫秒，解决游戏及部分 Electron 应用漏收按键的问题。

          ### 新增
          - 每个触发格支持最多 8 步动作序列，可插入等待。
          - 支持读取搜狗、豆包输入法的语音热键。
          - 支持按前台应用自动切换映射方案。
          - 准备页显示遥控器电量和未就绪错误码。
          - 新增鼠标键、滚轮、文本输出、按住快捷键等动作。
          - 新增通用、阅读、影音三套预设方案。
          - 语音工具预设扩展到微信输入法、Windows 语音输入、千问、搜狗、豆包和关闭。
          - 新增默认关闭的语音增强：高通滤波、自动增益、软限幅。
          - 新增首启准备页和应用内运行日志。
          - 新增 Google TV / Chromecast 遥控器机型档案，目前尚未真机验收。
          - 静音键现可在“该遥控器的其他按键”中配置。
          - 新增语音期间临时切换默认麦克风，默认关闭。该功能依赖未公开的 `IPolicyConfig`，验证前请勿开启。

          ### 变更
          - 未知动作类型降级为“未配置”，不再导致整份映射读取失败。
          - 设置 schema 升级到 4，旧配置缺失字段时自动使用默认值。

          ### 下载与校验
          - 应用内更新使用 `latest.json` 和 minisign 签名校验。
          - 文件校验和见 `SHA256SUMS.txt`。
          - Authenticode 代码签名仍待建立，首次运行可能触发 SmartScreen 提示。
          EOF

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -f make_latest=true \
            -f body="$(cat "${notes_path}")" \
            >/dev/null
          echo "Published ${RELEASE_TAG}"
