name: Windows Release

# 正式发布管线（应用内更新通道）：
# 1. push 形如 v0.2.0 的 tag 触发；
# 2. 用仓库 Secret TAURI_SIGNING_PRIVATE_KEY 构建 minisign 签名的 NSIS 安装器
#    （缺 Secret 直接失败——禁止用一次性密钥发布正式更新包）；
# 3. 生成 latest.json（updater 静态清单）并把资产重命名为纯 ASCII 文件名；
# 4. release/v0.2.10 分支已由完整 Windows CI 验收，本分支直接创建稳定 Release；
#    main 上后续版本仍保持先创建 Draft、人工核对后发布的默认流程。
on:
  workflow_dispatch:
  push:
    branches: ["release/v*"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify updater signing secret is present
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "缺少 TAURI_SIGNING_PRIVATE_KEY 仓库 Secret：正式 Release 必须用正式更新签名密钥构建（私钥丢失即无法再向存量用户推送更新，请先在 GitHub Secrets 配置并本地备份私钥）"
          }
          Write-Host "正式更新签名密钥已就绪"

      - name: Build RC003 hook native components
        # 注入器 + 钩子 DLL 必须先于 tauri build 产出（tauri.conf.json 的
        # bundle.resources 引用 target/rc003-hook/ 下两个产物，缺失即打包失败）。
        # Detours 源码从上游拉取并做 SHA256 校验，不安装任何软件。
        run: ./scripts/build-rc003-hook.ps1 -FetchSources

      - name: Build signed NSIS installer
        run: pnpm tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 密码变量缺失时 tauri build 会交互式等待输入（无 TTY 的 CI 上挂死，
          # 2026-09-06 本机矩阵实验实证）；正式密钥为无密码密钥，Secret 未配置时
          # 此处求值为空字符串，实测空字符串 + 无密码密钥可免交互完成签名。
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate updater manifest and stage release assets
        shell: pwsh
        # -Repository 必须显式传入当前仓库：脚本默认值是上游仓库，分支仓库
        # 若不传，latest.json 里的下载直链会指向上游的 Release（本仓库的
        # 更新包永远取不到）。
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -like "release/v*") {
            $tag = $tag -replace "^release/", ""
          }
          if ($tag -notmatch "^v\d+\.\d+\.\d+$") {
            throw "发布 ref 名称必须是 vX.Y.Z tag 或 release/vX.Y.Z 分支，当前为：$env:GITHUB_REF_NAME"
          }
          "SAYALL_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ./scripts/generate-updater-manifest.ps1 -Tag $tag -Repository $env:GITHUB_REPOSITORY

      - name: Show staged assets before release (delete-free verification)
        shell: pwsh
        run: |
          Write-Host "将上传到稳定 Release $env:GITHUB_REF_NAME 的资产清单："
          Get-ChildItem -LiteralPath "artifacts/windows-release" -File |
            ForEach-Object { Write-Host ("- {0} ({1} bytes)" -f $_.Name, $_.Length) }

      - name: Create stable GitHub release with assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:SAYALL_RELEASE_TAG
          $assets = Get-ChildItem -LiteralPath "artifacts/windows-release" -File | ForEach-Object { $_.FullName }
          $notes = @"
          ## 无线麦 SayAll Windows $tag

          ### 修复
          - 双击判定改为跟随 Windows 双击速度，并限制在 0.5-0.9 秒，减少蓝牙遥控器自然双击被识别成两次单击。
          - 映射按键新增可调保持时间，默认 30 毫秒，解决游戏及部分 Electron 应用漏收按键的问题。

          ### 新增
          - 每个触发格支持最多 8 步动作序列，可插入等待。
          - 支持读取搜狗、豆包输入法的语音热键。
          - 支持按前台应用自动切换映射方案。
          - 准备页显示遥控器电量和未就绪错误码。
          - 新增鼠标键、滚轮、文本输出、按住快捷键等动作。
          - 新增通用、阅读、影音三套预设方案。
          - 语音工具预设扩展到微信输入法、Windows 语音输入、千问、搜狗、豆包和关闭。
          - 新增默认关闭的语音增强：高通滤波、自动增益、软限幅。
          - 新增首启准备页和应用内运行日志。
          - 新增 Google TV / Chromecast 遥控器机型档案，目前尚未真机验收。
          - 静音键现可在“该遥控器的其他按键”中配置。
          - 新增语音期间临时切换默认麦克风，默认关闭。该功能依赖未公开的 IPolicyConfig，验证前请勿开启。

          ### 变更
          - 未知动作类型降级为“未配置”，不再导致整份映射读取失败。
          - 设置 schema 升级到 4，旧配置缺失字段时自动使用默认值。

          ### 下载与校验
          - 应用内更新使用 latest.json 和 minisign 签名校验。
          - 文件校验和见 SHA256SUMS.txt。
          - Authenticode 代码签名仍待建立，首次运行可能触发 SmartScreen 提示。
          "@
          gh release create $tag --target $env:GITHUB_SHA --latest --title "无线麦 SayAll Windows $tag" --notes $notes @assets
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create 失败（exit $LASTEXITCODE；本流程不做任何删除/覆盖）"
          }
          Write-Host "Stable Release $tag 已创建、发布并挂载资产"
